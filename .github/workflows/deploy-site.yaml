name: Deploy to Github Pages

# run when a commit is pushed to "source" branch, and once a day so
# future-dated posts auto-publish on their scheduled morning
on:
  push:
    branches:
    - main
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # checkout to the commit that has been pushed
    - uses: actions/checkout@v4

    # On scheduled / manual runs, push an empty commit to main so
    # Netlify (which only builds on push, not on cron) rebuilds too.
    # GH Pages keeps building from this same workflow run.
    - name: Trigger Netlify rebuild via empty commit
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit --allow-empty -m "chore: scheduled rebuild for date-gated posts"
        git push origin main

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true

    - name: Update Hugo Modules
      run: hugo mod tidy

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install node modules
      run: |
        hugo mod npm pack
        npm install

    - name: Build
      run: hugo --minify

    # push the generated content into the `gh-pages` branch.
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./public
