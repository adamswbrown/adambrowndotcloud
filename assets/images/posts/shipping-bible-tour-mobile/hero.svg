<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B726D"/>
      <stop offset="1" stop-color="#1F4A4E"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1E8"/>
      <stop offset="1" stop-color="#E4DCC9"/>
    </linearGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>

  <g opacity="0.08" fill="#F5F1E8" font-family="Georgia, serif">
    <text x="80" y="160" font-size="42">In the beginning</text>
    <text x="120" y="240" font-size="36">God created</text>
    <text x="60" y="880" font-size="38">the heavens</text>
    <text x="140" y="940" font-size="42">and the earth</text>
  </g>

  <g transform="translate(490 180)">
    <rect x="0" y="0" width="280" height="560" rx="38" ry="38" fill="#0F2A2C" stroke="#588978" stroke-width="3"/>
    <rect x="14" y="14" width="252" height="532" rx="26" ry="26" fill="url(#screen)"/>
    <rect x="115" y="26" width="50" height="6" rx="3" fill="#0F2A2C"/>
    <g font-family="Georgia, serif" fill="#1F4A4E">
      <text x="32" y="80" font-size="14" letter-spacing="2" fill="#588978">GENESIS 1</text>
      <text x="32" y="118" font-size="22" font-weight="bold">Day 1 of 66</text>
      <line x1="32" y1="138" x2="248" y2="138" stroke="#588978" stroke-width="1" opacity="0.4"/>
      <text x="32" y="180" font-size="13" fill="#3B726D">v.1  In the beginning, God</text>
      <text x="32" y="200" font-size="13" fill="#3B726D">created the heavens and</text>
      <text x="32" y="220" font-size="13" fill="#3B726D">the earth.</text>
      <text x="32" y="270" font-size="13" fill="#3B726D">v.27  So God created man</text>
      <text x="32" y="290" font-size="13" fill="#3B726D">in his own image...</text>
    </g>
    <g transform="translate(32 360)">
      <rect width="216" height="8" rx="4" fill="#588978" opacity="0.25"/>
      <rect width="48" height="8" rx="4" fill="#588978"/>
    </g>
    <g transform="translate(32 400)" font-family="Georgia, serif" fill="#1F4A4E">
      <circle cx="10" cy="10" r="10" fill="#588978"/>
      <text x="32" y="15" font-size="13">Genesis</text>
      <circle cx="10" cy="44" r="10" fill="none" stroke="#588978" stroke-width="2"/>
      <text x="32" y="49" font-size="13">Exodus</text>
      <circle cx="10" cy="78" r="10" fill="none" stroke="#588978" stroke-width="2"/>
      <text x="32" y="83" font-size="13">Leviticus</text>
    </g>
    <g transform="translate(110 510)">
      <circle cx="30" cy="10" r="14" fill="#588978"/>
      <polygon points="26,4 26,16 38,10" fill="#F5F1E8"/>
    </g>
  </g>

  <g transform="translate(820 240)">
    <rect x="0" y="0" width="240" height="480" rx="32" ry="32" fill="#0F2A2C" stroke="#296169" stroke-width="3"/>
    <rect x="12" y="12" width="216" height="456" rx="22" ry="22" fill="url(#screen)"/>
    <g font-family="Georgia, serif" fill="#1F4A4E">
      <text x="28" y="70" font-size="11" letter-spacing="2" fill="#296169">EXODUS 20:1-17</text>
      <text x="28" y="100" font-size="18" font-weight="bold">Originals</text>
      <line x1="28" y1="116" x2="212" y2="116" stroke="#296169" stroke-width="1" opacity="0.4"/>
    </g>
    <g transform="translate(28 140)" font-family="Georgia, serif">
      <text font-size="22" fill="#1F4A4E">בְּרֵאשִׁית</text>
      <text y="22" font-size="10" fill="#588978">H7225 — beginning</text>
      <text y="64" font-size="22" fill="#1F4A4E">בָּרָא</text>
      <text y="86" font-size="10" fill="#588978">H1254 — created</text>
      <text y="128" font-size="22" fill="#1F4A4E">אֱלֹהִים</text>
      <text y="150" font-size="10" fill="#588978">H430 — God</text>
    </g>
  </g>

  <g font-family="Georgia, serif" fill="#F5F1E8">
    <text x="80" y="430" font-size="56" font-weight="bold">Tour of the</text>
    <text x="80" y="494" font-size="56" font-weight="bold">Bible</text>
    <text x="82" y="538" font-size="22" opacity="0.75">66 books · iOS &amp; Android</text>
  </g>
  <g font-family="Georgia, serif" fill="#F5F1E8" opacity="0.85">
    <text x="1140" y="820" font-size="22">Two app stores.</text>
    <text x="1140" y="852" font-size="22">Fourteen days.</text>
  </g>
</svg>
